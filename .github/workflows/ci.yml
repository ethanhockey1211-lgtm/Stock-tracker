name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  core-and-tests:
    name: Build core + run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build Tremor.Core
        run: dotnet build src/Tremor.Core/Tremor.Core.csproj -c Release

      - name: Test
        run: dotnet test tests/Tremor.Core.Tests/Tremor.Core.Tests.csproj -c Release --verbosity normal

  maui-android:
    name: Build MAUI app (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build Tremor (net9.0-android)
        # Override TargetFrameworks so restore doesn't fan out to the iOS/MacCatalyst
        # TFMs (whose workloads only install on macOS). This builds android only.
        run: dotnet build src/Tremor/Tremor.csproj -c Release -p:TargetFrameworks=net9.0-android
